    - run: PATH="/opt/homebrew/opt/llvm/bin:$PATH" CMAKE_PREFIX_PATH="/opt/homebrew/opt/llvm" CFLAGS="-I/opt/homebrew/opt/llvm/include -DLIBDOVI_FOUND=1 -DLIBHDR10PLUS_RS_FOUND=1 $(pkg-config --cflags --static dovi) $(pkg-config --cflags --static hdr10plus-rs) -DNDEBUG -flto=full -fwhole-program-vtables -march=skylake -mtune=skylake -mno-gather -fno-exceptions -fno-rtti -fno-stack-protector -fno-sanitize=all -fno-dwarf2-cfi-asm -Wno-deprecated" CPPFLAGS="-I/opt/homebrew/opt/llvm/include -DLIBDOVI_FOUND=1 -DLIBHDR10PLUS_RS_FOUND=1 $(pkg-config --cflags --static dovi) $(pkg-config --cflags --static hdr10plus-rs) -DNDEBUG -flto=full -fwhole-program-vtables -march=skylake -mtune=skylake -mno-gather -fno-exceptions -fno-rtti -fno-stack-protector -fno-sanitize=all -fno-dwarf2-cfi-asm -Wno-deprecated" LDFLAGS="-fuse-ld=lld -L/opt/homebrew/opt/llvm/lib $(pkg-config --libs --static dovi) $(pkg-config --libs --static hdr10plus-rs) -flto=full -fwhole-program-vtables -Wl,-O3 -Wl,--lto-O3" Build/linux/build.sh --verbose --static --release --disable-native --enable-avx512 --disable-lto --enable-pgo --pgo-videos="$(realpath FoodMarket2)"
    - run: otool -L Bin/Release/SvtAv1EncApp
    - run: Bin/Release/SvtAv1EncApp --help | grep dolby
    - run: Bin/Release/SvtAv1EncApp --help | grep hdr10plus
    - run: Bin/Release/SvtAv1EncApp -i FoodMarket2/FoodMarket2.y4m -b /dev/null --preset 4 --crf 20.00 --tune 0 --film-grain 8 --enable-dlf 2 --cdef-scaling 1
    - run: cd Bin/Release && tar cJf macOS_x86-64_skylake.tar.xz SvtAv1EncApp && cd ../..
